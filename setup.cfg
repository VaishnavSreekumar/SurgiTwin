exclude = build,install,.git,.pytest_cache
ignore = D100,D101,D102,D103,D104,D105,D107,D205,D400,D415,E221,E241,I100,I101,I201,E231,E203,W503

[pep257]
ignore = D100,D101,D102,D103,D104,D105,D107,D205,D400,D415
